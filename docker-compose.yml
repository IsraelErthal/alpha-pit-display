services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpha-pit-display-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      GOOGLE_APPLICATION_CREDENTIALS: /app/${FIREBASE_CREDENTIALS_FILE:?Set FIREBASE_CREDENTIALS_FILE in .env to the Firebase service account JSON filename}
    ports:
      - "3000:3000"
    # Lets the container resolve host.docker.internal to the server's own host
    # network, needed to reach a MySQL installed directly on the server (not in
    # Docker) — point DATABASE_URL in .env at host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Firebase service account JSON — set FIREBASE_CREDENTIALS_FILE in .env to
    # the file's name (kept alongside docker-compose.yml).
    volumes:
      - ./${FIREBASE_CREDENTIALS_FILE:?Set FIREBASE_CREDENTIALS_FILE in .env to the Firebase service account JSON filename}:/app/${FIREBASE_CREDENTIALS_FILE}:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_YOUTUBE_VIDEO_ID: ${VITE_YOUTUBE_VIDEO_ID}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
    image: alpha-pit-display-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
