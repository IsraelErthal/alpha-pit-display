server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Google's OAuth popup (signInWithPopup) sends its own strict COOP header,
    # which otherwise isolates it from this app's window and breaks Firebase's
    # popup-closed detection ("Cross-Origin-Opener-Policy policy would block
    # the window.closed call"). same-origin-allow-popups keeps the
    # opener/popup relationship intact.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/, /admin) both serve the same SPA entrypoint.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
